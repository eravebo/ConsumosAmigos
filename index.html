<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melo">
<meta name="theme-color" content="#0B4250">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600..700,100,1;1,9..144,600..700,100,1&display=swap" rel="stylesheet">
<title>Melo · Consumos del paseo</title>
<style>
  /* Paseo playero: arena, mar, coral y sol. Fraunces (titulares) + DM Sans (texto). */
  :root {
    --arena: #FBF3E6;
    --arena-2: #F3E4CC;
    --espuma: #FFFDF8;
    --mar: #0E8A93;
    --mar-hondo: #0B4250;
    --coral: #FF6B4A;
    --sol: #FFC23D;
    --tinta: #183A40;
    --suave: #6E8186;
    --linea: #EADBC2;
    --titulo: "Fraunces", Georgia, serif;
    --texto: "DM Sans", -apple-system, system-ui, sans-serif;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --lado: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--arena); color: var(--tinta); }
  body {
    font-family: var(--texto); font-size: 16px; line-height: 1.45;
    padding-bottom: calc(76px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }
  .num, .t { font-family: var(--titulo); font-variation-settings: "SOFT" 100, "WONK" 1; }
  .label { display: block; font-size: 14px; font-weight: 600; color: var(--suave); margin: 0 0 8px; }

  /* ---------- Encabezado con olas ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, var(--mar-hondo) 0%, var(--mar) 100%);
    color: var(--espuma); padding: calc(14px + var(--safe-top)) var(--lado) 0;
  }
  .topbar-fila { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; position: relative; }
  .marca { font-family: var(--titulo); font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 700; font-style: italic; font-size: 36px; line-height: 1; margin: 0; letter-spacing: -.01em; }
  .sub { font-size: 14px; opacity: .85; margin-top: 3px; }
  .sol { position: absolute; right: 96px; top: -6px; width: 34px; height: 34px; border-radius: 50%; background: var(--sol); box-shadow: 0 0 0 6px rgba(255,194,61,.25); }
  .estado {
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.16); color: var(--espuma); position: relative;
  }
  .estado::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #7CF0B5; }
  .estado.pend::before { background: var(--sol); }
  .estado.envio::before { background: #fff; animation: parpadeo 1s infinite; }
  @keyframes parpadeo { 50% { opacity: .2; } }
  .olas { display: block; width: calc(100% + 2 * var(--lado)); margin: 0 calc(-1 * var(--lado)) -1px; height: 22px; }

  main { max-width: 560px; margin: 0 auto; padding: 0 var(--lado); }
  .vista { display: none; }
  .vista.activa { display: block; animation: entrar .35s var(--ease); }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .bloque { background: var(--espuma); border-radius: 24px; padding: 18px; margin-top: 16px; }

  input[type=text], textarea {
    width: 100%; border: 2px solid var(--linea); background: var(--arena);
    border-radius: 16px; padding: 13px 14px; font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none; transition: border-color .2s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--mar); }
  input::placeholder, textarea::placeholder { color: #A9A08F; }
  textarea { min-height: 70px; resize: vertical; }

  .valor-fila { display: flex; gap: 14px; align-items: flex-end; margin-top: 18px; }
  .valor-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; border-bottom: 2px dashed var(--linea); transition: border-color .2s; }
  .valor-wrap:focus-within { border-color: var(--coral); }
  .valor-wrap span { font-family: var(--titulo); font-size: 30px; color: var(--suave); margin-right: 4px; }
  .valor-wrap input {
    background: none !important; border: 0 !important; padding: 0 0 4px !important; border-radius: 0 !important;
    font-family: var(--titulo); font-variation-settings: "SOFT" 100, "WONK" 1; font-weight: 700; font-size: 42px !important; line-height: 1.15;
  }
  .stepper { display: flex; align-items: center; background: var(--arena); border-radius: 999px; height: 50px; border: 2px solid var(--linea); }
  .stepper button { width: 40px; height: 100%; font-size: 22px; color: var(--mar); font-weight: 600; }
  .stepper output { min-width: 22px; text-align: center; font-family: var(--titulo); font-weight: 700; font-size: 22px; }
  .x { font-size: 14px; font-weight: 600; color: var(--suave); text-align: center; margin-bottom: 6px; }

  .label-fila { display: flex; justify-content: space-between; align-items: baseline; }
  .todos-btn { font-size: 14px; font-weight: 600; color: var(--mar); }
  .personas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .persona {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 10px;
    border-radius: 20px; background: var(--arena); border: 2px solid transparent;
    transition: transform .2s var(--ease), background .2s, border-color .2s;
  }
  .persona:active { transform: scale(.94); }
  .persona .emoji { font-size: 30px; line-height: 1; transition: transform .3s var(--ease); }
  .persona .nom { font-size: 14px; font-weight: 600; color: var(--suave); }
  .persona.sel { background: #E2F4F2; border-color: var(--mar); }
  .persona.sel .emoji { transform: translateY(-2px) rotate(-6deg); }
  .persona.sel .nom { color: var(--mar-hondo); }
  .reparto { margin-top: 12px; font-size: 15px; color: var(--suave); min-height: 21px; }
  .reparto b { color: var(--tinta); font-family: var(--titulo); font-weight: 700; font-size: 18px; }

  .foto-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px;
    border-radius: 16px; border: 2px dashed var(--linea); color: var(--suave); font-weight: 600;
  }
  .foto-btn svg { width: 20px; height: 20px; }
  .foto-preview { position: relative; display: none; }
  .foto-preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 16px; display: block; }
  .foto-preview button { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(11,66,80,.7); color: #fff; font-size: 15px; }
  .campo + .campo { margin-top: 16px; }

  .btn-principal {
    width: 100%; padding: 17px; border-radius: 999px; margin: 18px 0 10px;
    background: var(--coral); color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: 0 8px 20px -8px rgba(255,107,74,.7);
    transition: transform .15s var(--ease), opacity .2s;
  }
  .btn-principal:active { transform: scale(.98); }
  .btn-principal:disabled { opacity: .5; }
  .btn-borde { width: 100%; padding: 14px; border-radius: 999px; border: 2px solid var(--mar); color: var(--mar); font-weight: 700; margin: 18px 0 26px; }

  /* Historial */
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 4px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .chip { padding: 8px 14px; border-radius: 999px; background: var(--espuma); white-space: nowrap; font-size: 15px; font-weight: 600; color: var(--suave); }
  .chip.sel { background: var(--mar); color: #fff; }
  .resumen-filtro { margin-top: 14px; }
  .resumen { background: var(--espuma); border-radius: 20px; padding: 16px 18px; }
  .resumen .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; color: var(--suave); font-size: 15px; }
  .resumen .cab b { font-family: var(--titulo); font-weight: 700; font-size: 30px; color: var(--tinta); white-space: nowrap; }
  .resumen .cab strong { color: var(--tinta); }
  .partes { display: flex; gap: 8px; margin-top: 12px; }
  .parte { flex: 1; background: var(--arena); border-radius: 14px; padding: 9px 12px; font-size: 13px; color: var(--suave); }
  .parte b { display: block; font-family: var(--titulo); font-weight: 700; font-size: 18px; color: var(--tinta); }
  .parte.comp { background: #E2F4F2; }
  .desglose { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cuota { font-size: 13px; font-weight: 600; background: var(--arena); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .cuota.yo { background: var(--mar); color: #fff; }
  .item-total { font-size: 12px; color: var(--suave); text-align: right; white-space: nowrap; }
  .grupo-dia { margin: 22px 4px 8px; font-family: var(--titulo); font-style: italic; font-weight: 600; font-size: 19px; color: var(--mar-hondo); text-transform: capitalize; }
  #lista .item { background: var(--espuma); border-radius: 20px; padding: 14px; margin-bottom: 10px; display: flex; gap: 12px; }
  .hora { width: 44px; flex-shrink: 0; font-size: 14px; font-weight: 600; color: var(--suave); padding-top: 2px; line-height: 1.2; }
  .hora small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; }
  .item-cuerpo { flex: 1; min-width: 0; }
  .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .item-top .prod { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .item-top .prod small { color: var(--suave); font-weight: 400; }
  .item-valor { font-family: var(--titulo); font-weight: 700; font-size: 20px; white-space: nowrap; }
  .item-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 14px; color: var(--suave); flex-wrap: wrap; }
  .quien { font-size: 17px; letter-spacing: 1px; }
  .item-nota { font-size: 14px; color: var(--suave); margin-top: 8px; padding: 7px 10px; background: var(--arena); border-radius: 10px; overflow-wrap: anywhere; }
  .item-pie { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; gap: 10px; }
  .item-pie:has(> .borrar:only-child) { margin-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; display: block; background: var(--arena); }
  .thumb-btn { flex-shrink: 0; }
  .borrar { font-size: 13px; font-weight: 600; color: var(--coral); padding: 4px 0; margin-left: auto; }
  .pago-wrap { margin-top: 18px; padding-top: 16px; border-top: 2px dashed var(--linea); }
  .pagos { display: flex; flex-wrap: wrap; gap: 8px; }
  .pago-op { padding: 9px 13px; border-radius: 999px; background: var(--arena); border: 2px solid transparent; font-size: 14px; font-weight: 600; color: var(--suave); }
  .pago-op.sel { background: #FFF1D6; border-color: var(--sol); color: var(--tinta); }
  .pago-ayuda { font-size: 13px; color: var(--suave); margin-top: 8px; }
  .tag-pago { font-size: 12px; font-weight: 700; color: #7a4b00; background: #FFE7A8; padding: 1px 8px; border-radius: 999px; }
  .tag-hotel { font-size: 12px; font-weight: 600; color: var(--suave); }
  #deudas { background: var(--espuma); border-radius: 24px; padding: 16px 18px; margin-top: 14px; }
  #deudas h3 { margin: 0 0 4px; font-family: var(--titulo); font-style: italic; font-weight: 700; font-size: 22px; color: var(--mar-hondo); }
  .deuda { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 2px dashed var(--linea); }
  .deuda:last-of-type { border-bottom: 0; }
  .deuda .quien-d { flex: 1; font-size: 15px; }
  .deuda .quien-d b { font-weight: 700; }
  .deuda .monto { font-family: var(--titulo); font-weight: 700; font-size: 20px; white-space: nowrap; }
  .deudas-nota { font-size: 13px; color: var(--suave); margin-top: 6px; }
  .hotel-pend { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding: 10px 12px; background: var(--arena); border-radius: 14px; font-size: 14px; color: var(--suave); }
  .hotel-pend b { font-family: var(--titulo); font-weight: 700; font-size: 18px; color: var(--tinta); }
  .tag-comp { font-size: 12px; font-weight: 600; color: var(--mar-hondo); background: #DDF1EF; padding: 1px 8px; border-radius: 999px; }
  .pend-tag { font-size: 12px; font-weight: 600; color: #7a5200; background: #FFE7A8; padding: 1px 8px; border-radius: 999px; }
  .vacio { text-align: center; color: var(--suave); padding: 60px 20px; }
  .vacio .t { font-weight: 700; font-style: italic; font-size: 26px; color: var(--tinta); margin-bottom: 6px; }

  /* Ranking */
  .total { background: var(--mar-hondo); color: var(--espuma); border-radius: 24px; padding: 20px; margin-top: 16px; position: relative; overflow: hidden; }
  .total .label { color: rgba(255,253,248,.75); }
  .total::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: var(--sol); opacity: .9; }
  .total .num { font-weight: 700; font-size: 52px; line-height: 1; position: relative; z-index: 1; }
  .stats { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
  .stat { font-size: 13px; color: rgba(255,253,248,.75); }
  .stat b { display: block; font-family: var(--titulo); font-weight: 700; font-size: 20px; color: var(--espuma); line-height: 1.2; }
  #ranking { background: var(--espuma); border-radius: 24px; padding: 4px 18px; margin-top: 14px; }
  .rank { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 2px dashed var(--linea); }
  .rank:last-child { border-bottom: 0; }
  .placa {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--titulo); font-weight: 700; font-size: 20px; background: var(--arena); color: var(--suave);
  }
  .rank.lider .placa { background: var(--sol); color: var(--mar-hondo); }
  .rank-cuerpo { flex: 1; min-width: 0; }
  .rank-nombre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-nombre .n { font-weight: 700; font-size: 17px; }
  .rank-nombre .v { font-family: var(--titulo); font-weight: 700; font-size: 20px; }
  .barra { height: 8px; background: var(--arena); border-radius: 99px; overflow: hidden; margin: 8px 0 5px; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: var(--mar); transition: width .8s var(--ease); }
  .rank.lider .barra i { background: var(--coral); }
  .rank-meta { font-size: 13px; color: var(--suave); }

  /* Barra inferior */
  .tabbar {
    position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom)); z-index: 20; display: flex;
    padding: 6px; background: var(--mar-hondo); border-radius: 999px; box-shadow: 0 10px 30px -10px rgba(11,66,80,.6);
    max-width: 480px; margin: 0 auto;
  }
  body { padding-bottom: calc(96px + var(--safe-bottom)); }
  .tab { flex: 1; padding: 11px 0; border-radius: 999px; font-size: 15px; font-weight: 600; color: rgba(255,253,248,.7); transition: background .25s var(--ease), color .2s; }
  .tab.activa { background: var(--espuma); color: var(--mar-hondo); }

  /* Toast, modal y visor */
  .toast {
    position: fixed; left: 50%; bottom: calc(86px + var(--safe-bottom)); transform: translate(-50%, 16px);
    background: var(--tinta); color: var(--espuma); padding: 11px 18px; border-radius: 999px; font-weight: 600; font-size: 15px;
    opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 50; max-width: 90vw; text-align: center;
  }
  .toast.ver { opacity: 1; transform: translate(-50%, 0); }
  .velo { position: fixed; inset: 0; background: rgba(11,66,80,.45); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
  .velo.ver { display: flex; }
  .hoja { background: var(--espuma); width: 100%; max-width: 560px; border-radius: 28px 28px 0 0; padding: 24px var(--lado) calc(18px + var(--safe-bottom)); animation: subir .3s var(--ease); }
  @keyframes subir { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .hoja h2 { margin: 0 0 6px; font-family: var(--titulo); font-weight: 700; font-style: italic; font-size: 26px; }
  .hoja p { margin: 0; color: var(--suave); }
  .hoja .botones { display: flex; gap: 10px; margin-top: 20px; }
  .hoja .botones button { flex: 1; padding: 15px; border-radius: 999px; font-weight: 700; font-size: 16px; }
  .btn-cancelar { background: var(--arena-2); }
  .btn-peligro { background: var(--coral); color: #fff; }
  .visor { position: fixed; inset: 0; background: rgba(11,30,36,.94); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
  .visor.ver { display: flex; }
  .visor img { max-width: 100%; max-height: 80vh; border-radius: 16px; }
  .visor a { position: absolute; bottom: calc(26px + var(--safe-bottom)); font-weight: 600; color: #fff; }
  .aviso { background: #FFE7A8; color: #6b4700; border-radius: 16px; padding: 12px 14px; font-size: 14px; margin-top: 16px; }
  .firma { text-align: center; font-family: var(--titulo); font-style: italic; font-size: 14px; color: var(--suave); padding-bottom: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-fila">
    <div>
      <h1 class="marca">Melo</h1>
      <div class="sub">Lo que consumimos en el hotel</div>
    </div>
    <span class="sol" aria-hidden="true"></span>
    <button id="estado-sync" class="estado">Al día</button>
  </div>
  <svg class="olas" viewBox="0 0 400 22" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10 Q 25 0 50 10 T 100 10 T 150 10 T 200 10 T 250 10 T 300 10 T 350 10 T 400 10 V22 H0Z" fill="#FBF3E6"/></svg>
</header>

<main>
  <div id="aviso-config" class="aviso" hidden>
    Falta la URL de la API en <b>CONFIG.API_URL</b> dentro de index.html.
  </div>

  <!-- ================= REGISTRAR ================= -->
  <section id="vista-registrar" class="vista activa">
    <form id="form" autocomplete="off" novalidate>
      <div class="bloque">
        <label class="label" for="producto">Producto</label>
        <input type="text" id="producto" list="sugerencias" placeholder="Cerveza, almuerzo, toalla extra…" enterkeyhint="next" maxlength="80">
        <datalist id="sugerencias"></datalist>

        <div class="valor-fila">
          <div style="flex:1;min-width:0">
            <label class="label" for="valor">Valor total</label>
            <div class="valor-wrap">
              <span>$</span>
              <input type="text" id="valor" inputmode="numeric" placeholder="0" enterkeyhint="done">
            </div>
          </div>
          <div>
            <div class="x">Cantidad</div>
            <div class="stepper">
              <button type="button" id="menos" aria-label="Menos">−</button>
              <output id="cantidad">1</output>
              <button type="button" id="mas" aria-label="Más">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bloque">
        <div class="label-fila">
          <span class="label">Quién consume</span>
          <button type="button" class="todos-btn" id="btn-todos">Todos</button>
        </div>
        <div class="personas" id="personas"></div>
        <div class="reparto" id="reparto"></div>
        <div class="pago-wrap">
          <span class="label">¿Quién pagó?</span>
          <div class="pagos" id="pagos"></div>
          <div class="pago-ayuda" id="pago-ayuda"></div>
        </div>
      </div>

      <div class="bloque">
        <div class="campo">
          <label class="label" for="nota">Nota</label>
          <textarea id="nota" placeholder="Opcional. Ej: pedido a la habitación, dijeron que era cortesía…" maxlength="300"></textarea>
        </div>
        <div class="campo">
          <label class="foto-btn" id="foto-btn" for="foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span>Adjuntar foto</span>
          </label>
          <input type="file" id="foto" accept="image/*" hidden>
          <div class="foto-preview" id="foto-preview">
            <img id="foto-img" alt="Vista previa">
            <button type="button" id="quitar-foto" aria-label="Quitar foto">✕</button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-principal" id="btn-guardar">Guardar consumo</button>
      <div class="firma">El que pelea paga la cuenta</div>
    </form>
  </section>

  <!-- ================= HISTORIAL ================= -->

<script>
/* ============================================================
   CONFIGURACIÓN — pega aquí la URL de tu implementación de Apps Script
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxy8Ppi8MzeUIsSxvuCS6T78zexVL1nKttzPv8R5JFBW-Vxt08C5o-hAoNWMiCL2RnaAQ/exec',   // termina en /exec
  MONEDA: 'COP',       // cambia a 'UYU', 'USD', etc. si lo necesitas
  LOCALE: 'es-CO'
};

const PERSONAS = [
  { id: 'Mejia',  emoji: '🐟', color: '#3b82f6' },
  { id: 'Leidy',  emoji: '💜', color: '#9b5de5' },
  { id: 'Camilo', emoji: '🐈', color: '#f59e0b' },
  { id: 'Evelyn', emoji: '🐮', color: '#16a34a' }
];
const EMOJI = Object.fromEntries(PERSONAS.map(p => [p.id, p.emoji]));

/* ============================================================
   Estado de la app
   ============================================================ */
let registros = lsLeer('melo_cache', []);         // lo que viene de Google Sheets
let pendientes = lsLeer('melo_pendientes', []);   // guardados sin conexión
let seleccion = new Set();
let pago = '';   // nombre de quien pagó (obligatorio)
let cantidad = 1;
let fotoDataUrl = null;
let filtro = 'Todos';
let sincronizando = false;

const $ = id => document.getElementById(id);
const apiConfigurada = () => /^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);

/* ---------- localStorage seguro (puede fallar en modo privado) ---------- */
function lsLeer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsGuardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* ---------- Formatos ---------- */
const fmtMoneda = new Intl.NumberFormat(CONFIG.LOCALE, { style: 'currency', currency: CONFIG.MONEDA, maximumFractionDigits: 0 });
const dinero = n => fmtMoneda.format(Math.round(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');

function ahora() {
  const d = new Date();
  return {
    fecha: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`,
    hora: `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`
  };
}
function nombreDia(fecha) {
  const [y, m, d] = String(fecha).split('-').map(Number);
  if (!y) return fecha;
  const f = new Date(y, m - 1, d);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dif = Math.round((hoy - f) / 86400000);
  if (dif === 0) return 'Hoy';
  if (dif === 1) return 'Ayer';
  return f.toLocaleDateString(CONFIG.LOCALE, { weekday: 'long', day: 'numeric', month: 'short' });
}
// La hoja guarda la hora en 24 h (HH:mm:ss); en pantalla se muestra en 12 h con AM/PM.
function hora12(h) {
  const [hh, mm] = String(h || '').split(':').map(Number);
  if (isNaN(hh) || isNaN(mm)) return { hora: String(h || ''), ampm: '' };
  return { hora: `${hh % 12 || 12}:${p2(mm)}`, ampm: hh < 12 ? 'AM' : 'PM' };
}
function nuevoId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('ver'), ms);
}

/* ============================================================
   Comunicación con Google Apps Script
   ============================================================ */
async function apiGet(params) {
  const url = new URL(CONFIG.API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const r = await fetch(url, { cache: 'no-store' });
  return r.json();
}
// Se envía como text/plain para evitar el "preflight" CORS que Apps Script no soporta.
async function apiPost(cuerpo) {
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  });
  return r.json();
}

async function cargarRegistros(silencioso = false) {
  if (!apiConfigurada()) return;
  try {
    const j = await apiGet({ accion: 'listar' });
    if (!j.ok) { if (!silencioso) toast(j.error); return; }
    registros = j.datos;
    lsGuardar('melo_cache', registros);
    renderTodo();
  } catch (e) {
    if (!silencioso) toast('Sin conexión: mostrando lo último guardado');
  }
}

async function sincronizar() {
  if (sincronizando || !pendientes.length || !apiConfigurada()) { actualizarEstado(); return; }
  sincronizando = true; actualizarEstado();
  let errorServidor = null;
  for (const reg of [...pendientes]) {
    try {
      const j = await apiPost({ accion: 'registrar', datos: reg });
      if (j.ok) {
        pendientes = pendientes.filter(p => p.id !== reg.id);
        lsGuardar('melo_pendientes', pendientes);
      } else { errorServidor = j.error; break; }
    } catch (e) { break; } // sin internet: se reintenta luego
  }
  sincronizando = false;
  actualizarEstado();
  if (errorServidor) toast(errorServidor, 4000);
  await cargarRegistros(true);
}

function actualizarEstado() {
  const b = $('estado-sync');
  if (sincronizando) { b.textContent = 'Enviando'; b.className = 'estado envio'; }
  else if (pendientes.length) { b.textContent = `${pendientes.length} sin enviar`; b.className = 'estado pend'; }
  else { b.textContent = 'Al día'; b.className = 'estado'; }
}

/* ============================================================
   Formulario de registro
   ============================================================ */
function renderPersonas() {
  $('personas').innerHTML = PERSONAS.map(p => `
    <button type="button" class="persona ${seleccion.has(p.id) ? 'sel' : ''}" data-id="${p.id}" aria-pressed="${seleccion.has(p.id)}">
      <span class="emoji">${p.emoji}</span><span class="nom">${p.id}</span>
    </button>`).join('');
  $('btn-todos').textContent = seleccion.size === PERSONAS.length ? 'Ninguno' : 'Todos';
  renderReparto();
}
function renderPagos() {
  $('pagos').innerHTML = PERSONAS.map(o =>
    `<button type="button" class="pago-op ${pago === o.id ? 'sel' : ''}" data-pago="${o.id}">${o.emoji} ${o.id}</button>`).join('');
  const v = valorActual(), otros = [...seleccion].filter(p => p !== pago);
  let ayuda = 'Elige quién pagó para saber quién le debe a quién.';
  if (pago) {
    ayuda = !seleccion.size ? `${pago} lo pagó.`
      : !otros.length ? `${pago} pagó lo suyo; nadie le debe.`
      : `${otros.join(', ')} le ${otros.length > 1 ? 'deben' : 'debe'} a ${pago}${v ? ' ' + dinero(v / seleccion.size) + (otros.length > 1 ? ' cada uno' : '') : ''}.`;
  }
  $('pago-ayuda').textContent = ayuda;
}
$('pagos').addEventListener('click', e => {
  const b = e.target.closest('[data-pago]'); if (!b) return;
  pago = b.dataset.pago; renderPagos();
});
function valorActual() { return Number($('valor').value.replace(/\D/g, '')) || 0; }
function renderReparto() {
  const v = valorActual(), n = seleccion.size;
  if (n > 1 && v > 0) $('reparto').innerHTML = `Entre ${n}: <b>${dinero(v / n)}</b> cada uno`;
  else if (n === 1 && v > 0) $('reparto').innerHTML = `Todo para ${[...seleccion][0]}: <b>${dinero(v)}</b>`;
  else $('reparto').textContent = 'Si lo compartieron, elige a varios y se divide.';
  renderPagos();
}

$('personas').addEventListener('click', e => {
  const b = e.target.closest('.persona'); if (!b) return;
  const id = b.dataset.id;
  seleccion.has(id) ? seleccion.delete(id) : seleccion.add(id);
  renderPersonas();
});
$('btn-todos').addEventListener('click', () => {
  seleccion = seleccion.size === PERSONAS.length ? new Set() : new Set(PERSONAS.map(p => p.id));
  renderPersonas();
});
$('valor').addEventListener('input', e => {
  const digitos = e.target.value.replace(/\D/g, '').slice(0, 10);
  e.target.value = digitos ? Number(digitos).toLocaleString(CONFIG.LOCALE) : '';
  renderReparto();
});
$('menos').addEventListener('click', () => { cantidad = Math.max(1, cantidad - 1); $('cantidad').textContent = cantidad; });
$('mas').addEventListener('click', () => { cantidad = Math.min(99, cantidad + 1); $('cantidad').textContent = cantidad; });

/* ---------- Foto: se reduce en el celular antes de enviarla ---------- */
function comprimirImagen(archivo, maxLado = 1280, calidad = 0.72) {
  return new Promise((resolver, rechazar) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * escala), h = Math.round(img.naturalHeight * escala);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolver(canvas.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rechazar(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
$('foto').addEventListener('change', async e => {
  const archivo = e.target.files[0]; if (!archivo) return;
  try {
    $('foto-btn').querySelector('span').textContent = 'Procesando…';
    fotoDataUrl = await comprimirImagen(archivo);
    $('foto-img').src = fotoDataUrl;
    $('foto-preview').style.display = 'block';
    $('foto-btn').style.display = 'none';
  } catch (err) { toast('No se pudo cargar la foto'); }
  finally { $('foto-btn').querySelector('span').textContent = 'Adjuntar foto'; e.target.value = ''; }
});
$('quitar-foto').addEventListener('click', quitarFoto);
function quitarFoto() {
  fotoDataUrl = null;
  $('foto-preview').style.display = 'none';
  $('foto-btn').style.display = 'flex';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const producto = $('producto').value.trim();
  const valor = valorActual();
  if (!producto) { toast('Escribe el producto'); $('producto').focus(); return; }
  if (!valor) { toast('Escribe el valor'); $('valor').focus(); return; }
  if (!seleccion.size) { toast('Elige quién lo consumió'); return; }
  if (!pago) { toast('Elige quién pagó'); return; }

  const reg = {
    id: nuevoId(), ...ahora(), producto, cantidad, valor,
    personas: [...seleccion], pago, nota: $('nota').value.trim(), foto: fotoDataUrl
  };

  pendientes.push(reg);
  if (!lsGuardar('melo_pendientes', pendientes) && reg.foto) {
    // Si no cabe en memoria local (fotos pesadas), se guarda igual sin respaldo local.
    console.warn('No se pudo respaldar localmente');
  }

  // Limpiar formulario
  $('form').reset(); $('valor').value = ''; cantidad = 1; $('cantidad').textContent = '1';
  seleccion = new Set(); pago = ''; renderPersonas(); quitarFoto();
  document.activeElement?.blur();

  toast(navigator.onLine ? 'Guardando…' : 'Sin internet: se enviará luego');
  renderTodo();
  await sincronizar();
  if (!pendientes.find(p => p.id === reg.id)) toast('Guardado en la hoja');
});

/* ============================================================
   Historial
   ============================================================ */
function todosLosRegistros() {
  const pend = pendientes.map(p => ({ ...p, pendiente: true, valorPorPersona: p.valor / p.personas.length }));
  return [...pend, ...registros].map(r => ({ ...r, pago: PERSONAS.some(p => p.id === r.pago) ? r.pago : '' })).sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));
}
function urlMiniatura(r, tam = 'w300') {
  if (r.pendiente) return r.foto || '';
  return r.fotoId ? `https://drive.google.com/thumbnail?id=${r.fotoId}&sz=${tam}` : '';
}

function renderFiltros() {
  const opciones = [{ id: 'Todos', emoji: '' }, ...PERSONAS];
  $('filtros').innerHTML = opciones.map(o =>
    `<button class="chip ${filtro === o.id ? 'sel' : ''}" data-f="${o.id}">${o.emoji ? o.emoji + ' ' : ''}${o.id}</button>`).join('');
}
$('filtros').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtro = b.dataset.f; renderHistorial();
});

function renderHistorial() {
  renderFiltros();
  const lista = todosLosRegistros().filter(r => filtro === 'Todos' || r.personas.includes(filtro));

  if (!lista.length) {
    $('resumen-filtro').innerHTML = '';
    $('lista').innerHTML = `<div class="vacio"><div class="t">Nada por aquí</div>${filtro !== 'Todos' ? esc(filtro) + ' no ha registrado nada todavía.' : 'Lo que registren aparecerá aquí.'}</div>`;
    return;
  }

  // ---- Resumen: cuánto suma y cómo se divide ----
  const esTodos = filtro === 'Todos';
  const individual = lista.filter(r => r.personas.length === 1);
  const compartido = lista.filter(r => r.personas.length > 1);
  const parte = r => esTodos ? r.valor : r.valorPorPersona;
  const sumaInd = individual.reduce((s, r) => s + parte(r), 0);
  const sumaComp = compartido.reduce((s, r) => s + parte(r), 0);
  const titulo = esTodos
    ? `<span>Cuenta total<br><small>${lista.length} consumo${lista.length > 1 ? 's' : ''}</small></span>`
    : `<span><strong>${EMOJI[filtro]} ${esc(filtro)}</strong> debe pagar<br><small>${lista.length} consumo${lista.length > 1 ? 's' : ''}</small></span>`;
  $('resumen-filtro').innerHTML = `
    <div class="resumen">
      <div class="cab">${titulo}<b>${dinero(sumaInd + sumaComp)}</b></div>
      <div class="partes">
        <div class="parte"><b>${dinero(sumaInd)}</b>${esTodos ? 'individual' : 'solo suyo'} · ${individual.length}</div>
        <div class="parte comp"><b>${dinero(sumaComp)}</b>${esTodos ? 'compartido' : 'su parte de lo compartido'} · ${compartido.length}</div>
      </div>
    </div>`;

  let html = '', diaActual = '';
  for (const r of lista) {
    if (r.fecha !== diaActual) { diaActual = r.fecha; html += `<div class="grupo-dia">${esc(nombreDia(r.fecha))}</div>`; }
    const mini = urlMiniatura(r);
    const foto = mini
      ? `<button class="thumb-btn" data-ver="${esc(r.id)}" aria-label="Ver foto"><img class="thumb" src="${esc(mini)}" loading="lazy" alt="" onerror="this.parentNode.remove()"></button>`
      : '';
    const esComp = r.personas.length > 1;
    // Valor grande: cuenta completa en "Todos"; solo lo que le toca a la persona filtrada.
    const valorMostrado = esTodos ? r.valor : r.valorPorPersona;
    const subValor = (!esTodos && esComp) ? `<div class="item-total">de ${dinero(r.valor)}</div>` : '';
    const etiqueta = esComp
      ? `<span class="tag-comp">Compartido entre ${r.personas.length}</span>`
      : `<span>${esTodos ? 'Solo ' + esc(r.personas[0]) + ' ' + (EMOJI[r.personas[0]] || '') : 'Solo suyo'}</span>`;
    // En "Todos" se ve cuánto le toca a cada uno; filtrando por persona, solo su parte (va en el valor grande).
    const desglose = (esComp && esTodos)
      ? `<div class="desglose">${r.personas.map(p => `<span class="cuota ${p === filtro ? 'yo' : ''}">${EMOJI[p] || '👤'} ${esc(p)} ${dinero(r.valorPorPersona)}</span>`).join('')}</div>`
      : '';
    html += `
      <div class="item">
        <div class="hora">${(h => `${esc(h.hora)}<small>${h.ampm}</small>`)(hora12(r.hora))}</div>
        <div class="item-cuerpo">
          <div class="item-top"><span class="prod">${esc(r.producto)}${r.cantidad > 1 ? ` <small>×${r.cantidad}</small>` : ''}</span><span><span class="item-valor">${dinero(valorMostrado)}</span>${subValor}</span></div>
          <div class="item-meta">${etiqueta}${r.pago ? `<span class="tag-pago">Pagó ${EMOJI[r.pago]} ${esc(r.pago)}</span>` : '<span class="tag-hotel">Sin quién pagó</span>'}${r.pendiente ? '<span class="pend-tag">Sin enviar</span>' : ''}</div>
          ${desglose}
          ${r.nota ? `<div class="item-nota">${esc(r.nota)}</div>` : ''}
          <div class="item-pie">${foto}<button class="borrar" data-borrar="${esc(r.id)}">Eliminar</button></div>
        </div>
      </div>`;
  }
  $('lista').innerHTML = html;
}

$('lista').addEventListener('click', async e => {
  const ver = e.target.closest('[data-ver]');
  if (ver) {
    const r = todosLosRegistros().find(x => x.id === ver.dataset.ver);
    if (r) abrirVisor(r);
    return;
  }
  const btn = e.target.closest('[data-borrar]'); if (!btn) return;
  const r = todosLosRegistros().find(x => x.id === btn.dataset.borrar); if (!r) return;
  const ok = await confirmar('¿Eliminar consumo?', `${r.producto} — ${dinero(r.valor)}. También se borrará de Google Sheets.`);
  if (!ok) return;

  if (r.pendiente) {
    pendientes = pendientes.filter(p => p.id !== r.id); lsGuardar('melo_pendientes', pendientes);
    renderTodo(); actualizarEstado(); toast('Eliminado'); return;
  }
  try {
    btn.textContent = 'Eliminando…';
    const j = await apiPost({ accion: 'eliminar', id: r.id });
    if (!j.ok) throw new Error(j.error);
    registros = registros.filter(x => x.id !== r.id); lsGuardar('melo_cache', registros);
    renderTodo(); toast('Eliminado');
  } catch (err) { btn.textContent = 'Eliminar'; toast('No se pudo eliminar: ' + (err.message || 'sin conexión')); }
});

function abrirVisor(r) {
  $('visor-img').src = r.pendiente ? r.foto : urlMiniatura(r, 'w1600');
  const link = $('visor-link');
  if (r.fotoUrl) { link.href = r.fotoUrl; link.style.display = ''; } else link.style.display = 'none';
  $('visor').classList.add('ver');
}
$('visor').addEventListener('click', e => { if (e.target.id !== 'visor-link') $('visor').classList.remove('ver'); });

/* ============================================================
   Ranking 🏆
   ============================================================ */
function calcularTotales() {
  const t = Object.fromEntries(PERSONAS.map(p => [p.id, { ...p, total: 0, consumos: 0 }]));
  for (const r of todosLosRegistros()) {
    const parte = r.valor / r.personas.length;
    for (const p of r.personas) if (t[p]) { t[p].total += parte; t[p].consumos++; }
  }
  return Object.values(t).sort((a, b) => b.total - a.total);
}

// Quién le debe a quién: cada consumo pagado por alguien genera deudas de los demás
// participantes hacia esa persona. Luego se simplifica para hacer el mínimo de pagos.
function calcularDeudas() {
  const saldo = Object.fromEntries(PERSONAS.map(p => [p.id, 0]));
  let sinPago = 0;
  for (const r of todosLosRegistros()) {
    if (!r.pago) { sinPago += r.valor; continue; }
    const parte = r.valor / r.personas.length;
    for (const q of r.personas) {
      if (q !== r.pago && q in saldo) { saldo[q] -= parte; saldo[r.pago] += parte; }
    }
  }
  const deben = Object.entries(saldo).filter(([, v]) => v < -0.5).map(([id, v]) => ({ id, v: -v })).sort((a, b) => b.v - a.v);
  const reciben = Object.entries(saldo).filter(([, v]) => v > 0.5).map(([id, v]) => ({ id, v })).sort((a, b) => b.v - a.v);
  const pagos = [];
  let i = 0, j = 0;
  while (i < deben.length && j < reciben.length) {
    const monto = Math.min(deben[i].v, reciben[j].v);
    pagos.push({ de: deben[i].id, a: reciben[j].id, monto });
    deben[i].v -= monto; reciben[j].v -= monto;
    if (deben[i].v < 0.5) i++;
    if (reciben[j].v < 0.5) j++;
  }
  return { pagos, sinPago };
}

function renderDeudas() {
  const { pagos, sinPago } = calcularDeudas();
  const filas = pagos.length
    ? pagos.map(p => `
        <div class="deuda">
          <div class="quien-d">${EMOJI[p.de]} <b>${esc(p.de)}</b> le debe a ${EMOJI[p.a]} <b>${esc(p.a)}</b></div>
          <div class="monto">${dinero(p.monto)}</div>
        </div>`).join('')
    : '<div class="deudas-nota">Nadie le debe a nadie. Cuando alguien pague algo compartido, aquí aparece quién le debe.</div>';
  $('deudas').innerHTML = `<h3>Quién le debe a quién</h3>${filas}`
    + (sinPago ? `<div class="hotel-pend"><span>Consumos sin quién pagó (no cuentan aquí)</span><b>${dinero(sinPago)}</b></div>` : '');
}

function renderRanking() {
  renderDeudas();
  const todos = todosLosRegistros();
  const totales = calcularTotales();
  const totalViaje = todos.reduce((s, r) => s + r.valor, 0);
  const maximo = Math.max(1, ...totales.map(t => t.total));
  const masCaro = todos.reduce((m, r) => (!m || r.valor > m.valor ? r : m), null);

  $('total-viaje').textContent = dinero(totalViaje);
  const dias = new Set(todos.map(r => r.fecha)).size;
  $('stats').innerHTML = `<div class="stat"><b>${todos.length}</b>consumos</div><div class="stat"><b>${dias}</b>día${dias === 1 ? '' : 's'}</div>`
    + (masCaro ? `<div class="stat"><b>${dinero(masCaro.valor)}</b>el más caro: ${esc(masCaro.producto)}</div>` : '');

  $('ranking').innerHTML = totales.map((t, i) => `
    <div class="rank ${i === 0 && t.total > 0 ? 'lider' : ''}">
      <div class="placa">${t.total > 0 ? String(i + 1).padStart(2, '0') : '—'}</div>
      <div class="rank-cuerpo">
        <div class="rank-nombre"><span class="n">${t.emoji} ${esc(t.id)}${i === 0 && t.total > 0 ? ' 🏆' : ''}</span><span class="v">${dinero(t.total)}</span></div>
        <div class="barra"><i style="width:${(t.total / maximo) * 100}%"></i></div>
        <div class="rank-meta">${t.consumos} consumo${t.consumos === 1 ? '' : 's'} · ${totalViaje ? Math.round((t.total / totalViaje) * 100) : 0}% del total</div>
      </div>
    </div>`).join('');
}

$('btn-copiar').addEventListener('click', async () => {
  const totales = calcularTotales();
  const total = todosLosRegistros().reduce((s, r) => s + r.valor, 0);
  const { fecha, hora } = ahora();
  const texto = [`🏖️ Consumos paseo a Melo (corte ${fecha} ${(h => h.hora + ' ' + h.ampm)(hora12(hora))})`, '',
    ...totales.map((t, i) => `${['🥇', '🥈', '🥉', '4️⃣'][i]} ${t.emoji} ${t.id}: ${dinero(t.total)} (${t.consumos})`),
    '', `💰 Total: ${dinero(total)}`,
    ...(() => { const { pagos } = calcularDeudas();
      return ['', '💸 Quién le debe a quién:', ...(pagos.length ? pagos.map(p => `${EMOJI[p.de]} ${p.de} → ${EMOJI[p.a]} ${p.a}: ${dinero(p.monto)}`) : ['Nadie le debe a nadie'])]; })(),
    '', 'El que pelea paga la cuenta 😌'].join('\n');
  try { await navigator.clipboard.writeText(texto); toast('Resumen copiado'); }
  catch { toast('No se pudo copiar'); }
});

/* ============================================================
   Navegación, modales y arranque
   ============================================================ */
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('activa', t === tab));
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === 'vista-' + tab.dataset.vista));
  window.scrollTo({ top: 0 });
  if (tab.dataset.vista !== 'registrar') cargarRegistros(true);
}));

function renderSugerencias() {
  const unicos = [...new Set(registros.map(r => r.producto))].slice(0, 40);
  $('sugerencias').innerHTML = unicos.map(p => `<option value="${esc(p)}">`).join('');
}
function renderTodo() { renderHistorial(); renderRanking(); renderSugerencias(); actualizarEstado(); }

$('estado-sync').addEventListener('click', async () => { await sincronizar(); await cargarRegistros(); toast('Datos actualizados'); });

function confirmar(titulo, texto) {
  return new Promise(resolver => {
    $('conf-titulo').textContent = titulo; $('conf-texto').textContent = texto;
    const m = $('modal-confirmar'); m.classList.add('ver');
    const cerrar = v => { m.classList.remove('ver'); $('conf-si').onclick = $('conf-no').onclick = null; resolver(v); };
    $('conf-si').onclick = () => cerrar(true);
    $('conf-no').onclick = () => cerrar(false);
  });
}

window.addEventListener('online', sincronizar);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sincronizar(); cargarRegistros(true); } });

// Arranque
$('aviso-config').hidden = apiConfigurada();
renderPersonas();
renderTodo();
if (apiConfigurada()) { cargarRegistros(true); sincronizar(); }
</script>
</body>
</html>
