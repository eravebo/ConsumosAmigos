<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melo">
<meta name="theme-color" content="#141414">
<meta name="color-scheme" content="dark">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preload" href="fonts/BarlowCondensed-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
<title>Melo · Consumos</title>
<style>
  /* Identidad Seven Travel: asfalto, rojo, tiza y línea vial. Barlow = señalización vial. */
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-ExtraBold.woff2") format("woff2"); font-weight: 800; font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; src: url("fonts/BarlowCondensed-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Barlow"; src: url("fonts/Barlow-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }

  :root {
    --asfalto: #141414;
    --asfalto-2: #1B1B1B;
    --via: #2A2A2A;
    --rojo: #E10600;
    --rojo-texto: #FF5A4E;
    --tiza: #F4F4F0;
    --niebla: #A8A8A3;
    --linea-vial: #F2B705;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", -apple-system, system-ui, sans-serif;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --lado: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--asfalto); color: var(--tiza); }
  body {
    font-family: var(--body); font-size: 16px; line-height: 1.45;
    padding-top: var(--safe-top);
    padding-bottom: calc(70px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  [hidden] { display: none !important; }

  .cond { font-family: var(--display); text-transform: uppercase; }
  .label {
    display: block; font-family: var(--display); font-weight: 600; font-size: 14px;
    text-transform: uppercase; letter-spacing: .1em; color: var(--niebla); margin: 0 0 8px;
  }
  /* Línea amarilla discontinua de carretera */
  .linea {
    height: 3px; margin: 0;
    background: repeating-linear-gradient(90deg, var(--linea-vial) 0 22px, transparent 22px 38px);
    opacity: .9;
  }

  /* ---------- Encabezado ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10; background: var(--asfalto);
    padding: 14px var(--lado) 0;
  }
  .topbar-fila { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 12px; }
  .marca { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .9; letter-spacing: -.01em; text-transform: uppercase; margin: 0; }
  .marca span { color: var(--rojo); }
  .sub { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--niebla); margin-top: 4px; }
  .estado {
    font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--niebla); display: flex; align-items: center; gap: 7px; padding: 6px 0;
  }
  .estado::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ecf6e; }
  .estado.pend { color: var(--linea-vial); }
  .estado.pend::before { background: var(--linea-vial); }
  .estado.envio::before { background: var(--niebla); animation: parpadeo 1s infinite; }
  @keyframes parpadeo { 50% { opacity: .2; } }

  main { max-width: 560px; margin: 0 auto; padding: 0 var(--lado); }
  .vista { display: none; }
  .vista.activa { display: block; animation: entrar .35s var(--ease); }
  @keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .bloque { padding: 22px 0; border-bottom: 1px solid var(--via); }
  .bloque:last-of-type { border-bottom: 0; }

  input[type=text], textarea {
    width: 100%; border: 1.5px solid transparent; background: var(--asfalto-2);
    border-radius: 12px; padding: 14px; font-size: 17px; outline: none;
    -webkit-appearance: none; appearance: none; transition: border-color .2s;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--tiza); }
  input::placeholder, textarea::placeholder { color: #6b6b67; }
  textarea { min-height: 70px; resize: vertical; }

  /* Valor: el número es protagonista */
  .valor-fila { display: flex; gap: 14px; align-items: flex-end; margin-top: 18px; }
  .valor-wrap { flex: 1; min-width: 0; display: flex; align-items: baseline; border-bottom: 2px solid var(--via); transition: border-color .2s; }
  .valor-wrap:focus-within { border-color: var(--rojo); }
  .valor-wrap span { font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--niebla); margin-right: 4px; }
  .valor-wrap input {
    background: none !important; border: 0 !important; padding: 0 0 4px !important; border-radius: 0 !important;
    font-family: var(--display); font-weight: 800; font-size: 46px !important; line-height: 1.1; letter-spacing: -.01em;
  }
  .stepper { display: flex; align-items: center; background: var(--asfalto-2); border-radius: 12px; height: 52px; }
  .stepper button { width: 42px; height: 100%; font-size: 24px; color: var(--niebla); }
  .stepper output { min-width: 26px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 24px; }
  .x { font-family: var(--display); font-weight: 600; text-transform: uppercase; color: var(--niebla); font-size: 13px; letter-spacing: .1em; text-align: center; margin-bottom: 6px; }

  /* Personas */
  .label-fila { display: flex; justify-content: space-between; align-items: baseline; }
  .todos-btn { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--tiza); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--rojo); }
  .personas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .persona {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px 11px;
    border-radius: 14px; background: var(--asfalto-2); border: 1.5px solid transparent;
    transition: transform .15s var(--ease), background .2s, border-color .2s;
  }
  .persona:active { transform: scale(.95); }
  .persona .emoji { font-size: 28px; line-height: 1; }
  .persona .nom { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--niebla); }
  .persona.sel { background: var(--rojo); border-color: var(--rojo); }
  .persona.sel .nom { color: #fff; }
  .reparto { margin-top: 12px; font-size: 15px; color: var(--niebla); min-height: 21px; }
  .reparto b { color: var(--tiza); font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em; }

  /* Foto */
  .foto-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px;
    border-radius: 12px; border: 1.5px dashed #3a3a3a; color: var(--niebla);
    font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .08em; text-transform: uppercase;
  }
  .foto-btn svg { width: 20px; height: 20px; }
  .foto-preview { position: relative; display: none; }
  .foto-preview img { width: 100%; max-height: 260px; object-fit: cover; border-radius: 12px; display: block; }
  .foto-preview button { position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%; background: rgba(20,20,20,.75); color: #fff; font-size: 15px; }
  .campo + .campo { margin-top: 18px; }

  .btn-principal {
    width: 100%; padding: 17px; border-radius: 12px; margin: 6px 0 26px;
    background: var(--rojo); color: #fff;
    font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .06em; text-transform: uppercase;
    transition: transform .15s var(--ease), opacity .2s;
  }
  .btn-principal:active { transform: scale(.98); }
  .btn-principal:disabled { opacity: .5; }
  .btn-borde {
    width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--via);
    font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; margin: 18px 0 26px;
  }

  /* Historial */
  .filtros { display: flex; gap: 8px; overflow-x: auto; padding: 18px 0 4px; scrollbar-width: none; }
  .filtros::-webkit-scrollbar { display: none; }
  .chip {
    padding: 8px 14px; border-radius: 999px; background: var(--asfalto-2); white-space: nowrap;
    font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--niebla);
  }
  .chip.sel { background: var(--tiza); color: var(--asfalto); }
  .resumen-filtro { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 0; color: var(--niebla); font-size: 15px; }
  .resumen-filtro b { font-family: var(--display); font-weight: 800; font-size: 26px; color: var(--tiza); }
  .grupo-dia { display: flex; align-items: center; gap: 12px; margin: 22px 0 4px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--linea-vial); }
  .grupo-dia::after { content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--linea-vial) 0 12px, transparent 12px 20px); opacity: .5; }
  .item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--via); }
  .item:last-child { border-bottom: 0; }
  .hora { width: 42px; flex-shrink: 0; font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--niebla); padding-top: 2px; }
  .item-cuerpo { flex: 1; min-width: 0; }
  .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .item-top .prod { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  .item-top .prod small { color: var(--niebla); font-weight: 400; }
  .item-valor { font-family: var(--display); font-weight: 800; font-size: 21px; white-space: nowrap; }
  .item-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 14px; color: var(--niebla); flex-wrap: wrap; }
  .quien { font-size: 17px; letter-spacing: 1px; }
  .item-nota { font-size: 14px; color: var(--niebla); margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--rojo); overflow-wrap: anywhere; }
  .item-pie { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 8px; gap: 10px; }
  .item-pie:has(> .borrar:only-child) { margin-top: 0; }
  .thumb { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; display: block; background: var(--asfalto-2); }
  .thumb-btn { flex-shrink: 0; }
  .borrar { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--rojo-texto); padding: 4px 0; margin-left: auto; }
  .pend-tag { font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--asfalto); background: var(--linea-vial); padding: 1px 7px; border-radius: 4px; }
  .vacio { text-align: center; color: var(--niebla); padding: 60px 20px; }
  .vacio .cond { font-weight: 800; font-size: 26px; color: var(--tiza); margin-bottom: 6px; }

  /* Ranking */
  .total { padding: 24px 0 20px; }
  .total .num { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: .95; letter-spacing: -.01em; }
  .stats { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
  .stat { font-size: 14px; color: var(--niebla); }
  .stat b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--tiza); line-height: 1.1; }
  .rank { display: flex; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--via); }
  .rank:last-child { border-bottom: 0; }
  .placa {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 10px; display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 24px; background: var(--asfalto-2); color: var(--niebla);
  }
  .rank.lider .placa { background: var(--linea-vial); color: var(--asfalto); }
  .rank-cuerpo { flex: 1; min-width: 0; }
  .rank-nombre { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .rank-nombre .n { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
  .rank-nombre .v { font-family: var(--display); font-weight: 800; font-size: 22px; }
  .barra { height: 6px; background: var(--asfalto-2); border-radius: 99px; overflow: hidden; margin: 8px 0 5px; }
  .barra i { display: block; height: 100%; border-radius: 99px; background: var(--niebla); transition: width .8s var(--ease); }
  .rank.lider .barra i { background: var(--rojo); }
  .rank-meta { font-size: 13px; color: var(--niebla); }

  /* Barra inferior */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex;
    padding: 0 8px var(--safe-bottom); background: var(--asfalto); border-top: 1px solid var(--via);
  }
  .tab {
    flex: 1; padding: 16px 0 14px; position: relative;
    font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: #6b6b67;
    transition: color .2s;
  }
  .tab::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 3px; background: var(--rojo); border-radius: 0 0 3px 3px; transform: scaleX(0); transition: transform .3s var(--ease); }
  .tab.activa { color: var(--tiza); }
  .tab.activa::before { transform: scaleX(1); }

  /* Toast, modal y visor */
  .toast {
    position: fixed; left: 50%; bottom: calc(84px + var(--safe-bottom)); transform: translate(-50%, 16px);
    background: var(--tiza); color: var(--asfalto); padding: 11px 18px; border-radius: 12px;
    font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .04em; text-transform: uppercase;
    opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 50; max-width: 90vw; text-align: center;
  }
  .toast.ver { opacity: 1; transform: translate(-50%, 0); }
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; display: none; align-items: flex-end; justify-content: center; }
  .velo.ver { display: flex; }
  .hoja { background: var(--asfalto-2); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 24px var(--lado) calc(18px + var(--safe-bottom)); animation: subir .3s var(--ease); }
  @keyframes subir { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .hoja h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 800; font-size: 28px; text-transform: uppercase; }
  .hoja p { margin: 0; color: var(--niebla); }
  .hoja .botones { display: flex; gap: 10px; margin-top: 20px; }
  .hoja .botones button { flex: 1; padding: 15px; border-radius: 12px; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
  .btn-cancelar { background: var(--via); }
  .btn-peligro { background: var(--rojo); color: #fff; }
  .visor { position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 60; display: none; align-items: center; justify-content: center; padding: 20px; }
  .visor.ver { display: flex; }
  .visor img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
  .visor a { position: absolute; bottom: calc(26px + var(--safe-bottom)); font-family: var(--display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--tiza); }
  .aviso { background: var(--linea-vial); color: var(--asfalto); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-top: 16px; }
  .firma { text-align: center; font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #4a4a47; padding-bottom: 8px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-fila">
    <div>
      <h1 class="marca">Melo<span>.</span></h1>
      <div class="sub">Consumos del hotel</div>
    </div>
    <button id="estado-sync" class="estado">Al día</button>
  </div>
  <div class="linea"></div>
</header>

<main>
  <div id="aviso-config" class="aviso" hidden>
    Falta la URL de la API en <b>CONFIG.API_URL</b> dentro de index.html.
  </div>

  <!-- ================= REGISTRAR ================= -->
  <section id="vista-registrar" class="vista activa">
    <form id="form" autocomplete="off" novalidate>
      <div class="bloque">
        <label class="label" for="producto">Producto</label>
        <input type="text" id="producto" list="sugerencias" placeholder="Cerveza, almuerzo, toalla extra…" enterkeyhint="next" maxlength="80">
        <datalist id="sugerencias"></datalist>

        <div class="valor-fila">
          <div style="flex:1;min-width:0">
            <label class="label" for="valor">Valor total</label>
            <div class="valor-wrap">
              <span>$</span>
              <input type="text" id="valor" inputmode="numeric" placeholder="0" enterkeyhint="done">
            </div>
          </div>
          <div>
            <div class="x">Cant.</div>
            <div class="stepper">
              <button type="button" id="menos" aria-label="Menos">−</button>
              <output id="cantidad">1</output>
              <button type="button" id="mas" aria-label="Más">+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bloque">
        <div class="label-fila">
          <span class="label">Quién consume</span>
          <button type="button" class="todos-btn" id="btn-todos">Todos</button>
        </div>
        <div class="personas" id="personas"></div>
        <div class="reparto" id="reparto"></div>
      </div>

      <div class="bloque">
        <div class="campo">
          <label class="label" for="nota">Nota</label>
          <textarea id="nota" placeholder="Opcional. Ej: pedido a la habitación, dijeron que era cortesía…" maxlength="300"></textarea>
        </div>
        <div class="campo">
          <label class="foto-btn" id="foto-btn" for="foto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span>Adjuntar foto</span>
          </label>
          <input type="file" id="foto" accept="image/*" hidden>
          <div class="foto-preview" id="foto-preview">
            <img id="foto-img" alt="Vista previa">
            <button type="button" id="quitar-foto" aria-label="Quitar foto">✕</button>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-principal" id="btn-guardar">Guardar consumo</button>
      <div class="firma">Seven Travel · ruta Melo</div>
    </form>
  </section>

  <!-- ================= HISTORIAL ================= -->
  <section id="vista-historial" class="vista">
    <div class="filtros" id="filtros"></div>
    <div class="resumen-filtro" id="resumen-filtro"></div>
    <div id="lista"></div>
  </section>

  <!-- ================= RANKING ================= -->
  <section id="vista-ranking" class="vista">
    <div class="total">
      <span class="label">Total del viaje</span>
      <div class="num" id="total-viaje">$0</div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="linea"></div>
    <div id="ranking"></div>
    <button class="btn-borde" id="btn-copiar">Copiar resumen para WhatsApp</button>
  </section>
</main>

<nav class="tabbar">
  <button class="tab activa" data-vista="registrar">Registrar</button>
  <button class="tab" data-vista="historial">Historial</button>
  <button class="tab" data-vista="ranking">Ranking</button>
</nav>

<div class="toast" id="toast"></div>

<!-- Confirmación -->
<div class="velo" id="modal-confirmar">
  <div class="hoja">
    <h2 id="conf-titulo">¿Eliminar?</h2>
    <p id="conf-texto"></p>
    <div class="botones">
      <button class="btn-cancelar" id="conf-no">Cancelar</button>
      <button class="btn-peligro" id="conf-si">Eliminar</button>
    </div>
  </div>
</div>

<!-- Visor de fotos -->
<div class="visor" id="visor">
  <img id="visor-img" alt="Foto del consumo">
  <a id="visor-link" target="_blank" rel="noopener">Abrir en Google Drive ↗</a>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — pega aquí la URL de tu implementación de Apps Script
   ============================================================ */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwdk3KPjqlPdr4gxGEP19CIt3skWbVC04l1tsB7fXIkvt5UjXfksv2xoF6oVAox8XloQQ/exec',   // termina en /exec
  MONEDA: 'COP',       // cambia a 'UYU', 'USD', etc. si lo necesitas
  LOCALE: 'es-CO'
};

const PERSONAS = [
  { id: 'Mejia',  emoji: '🐟', color: '#3b82f6' },
  { id: 'Leidy',  emoji: '💜', color: '#9b5de5' },
  { id: 'Camilo', emoji: '🐈', color: '#f59e0b' },
  { id: 'Evelyn', emoji: '🐊', color: '#16a34a' }
];
const EMOJI = Object.fromEntries(PERSONAS.map(p => [p.id, p.emoji]));

/* ============================================================
   Estado de la app
   ============================================================ */
let registros = lsLeer('melo_cache', []);         // lo que viene de Google Sheets
let pendientes = lsLeer('melo_pendientes', []);   // guardados sin conexión
let seleccion = new Set();
let cantidad = 1;
let fotoDataUrl = null;
let filtro = 'Todos';
let sincronizando = false;

const $ = id => document.getElementById(id);
const apiConfigurada = () => /^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);

/* ---------- localStorage seguro (puede fallar en modo privado) ---------- */
function lsLeer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } }
function lsGuardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } }

/* ---------- Formatos ---------- */
const fmtMoneda = new Intl.NumberFormat(CONFIG.LOCALE, { style: 'currency', currency: CONFIG.MONEDA, maximumFractionDigits: 0 });
const dinero = n => fmtMoneda.format(Math.round(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const p2 = n => String(n).padStart(2, '0');

function ahora() {
  const d = new Date();
  return {
    fecha: `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`,
    hora: `${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`
  };
}
function nombreDia(fecha) {
  const [y, m, d] = String(fecha).split('-').map(Number);
  if (!y) return fecha;
  const f = new Date(y, m - 1, d);
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const dif = Math.round((hoy - f) / 86400000);
  if (dif === 0) return 'Hoy';
  if (dif === 1) return 'Ayer';
  return f.toLocaleDateString(CONFIG.LOCALE, { weekday: 'long', day: 'numeric', month: 'short' });
}
function nuevoId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('toast'); t.textContent = msg; t.classList.add('ver');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('ver'), ms);
}

/* ============================================================
   Comunicación con Google Apps Script
   ============================================================ */
async function apiGet(params) {
  const url = new URL(CONFIG.API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const r = await fetch(url, { cache: 'no-store' });
  return r.json();
}
// Se envía como text/plain para evitar el "preflight" CORS que Apps Script no soporta.
async function apiPost(cuerpo) {
  const r = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  });
  return r.json();
}

async function cargarRegistros(silencioso = false) {
  if (!apiConfigurada()) return;
  try {
    const j = await apiGet({ accion: 'listar' });
    if (!j.ok) { if (!silencioso) toast(j.error); return; }
    registros = j.datos;
    lsGuardar('melo_cache', registros);
    renderTodo();
  } catch (e) {
    if (!silencioso) toast('Sin conexión: mostrando lo último guardado');
  }
}

async function sincronizar() {
  if (sincronizando || !pendientes.length || !apiConfigurada()) { actualizarEstado(); return; }
  sincronizando = true; actualizarEstado();
  let errorServidor = null;
  for (const reg of [...pendientes]) {
    try {
      const j = await apiPost({ accion: 'registrar', datos: reg });
      if (j.ok) {
        pendientes = pendientes.filter(p => p.id !== reg.id);
        lsGuardar('melo_pendientes', pendientes);
      } else { errorServidor = j.error; break; }
    } catch (e) { break; } // sin internet: se reintenta luego
  }
  sincronizando = false;
  actualizarEstado();
  if (errorServidor) toast(errorServidor, 4000);
  await cargarRegistros(true);
}

function actualizarEstado() {
  const b = $('estado-sync');
  if (sincronizando) { b.textContent = 'Enviando'; b.className = 'estado envio'; }
  else if (pendientes.length) { b.textContent = `${pendientes.length} sin enviar`; b.className = 'estado pend'; }
  else { b.textContent = 'Al día'; b.className = 'estado'; }
}

/* ============================================================
   Formulario de registro
   ============================================================ */
function renderPersonas() {
  $('personas').innerHTML = PERSONAS.map(p => `
    <button type="button" class="persona ${seleccion.has(p.id) ? 'sel' : ''}" data-id="${p.id}" aria-pressed="${seleccion.has(p.id)}">
      <span class="emoji">${p.emoji}</span><span class="nom">${p.id}</span>
    </button>`).join('');
  $('btn-todos').textContent = seleccion.size === PERSONAS.length ? 'Ninguno' : 'Todos';
  renderReparto();
}
function valorActual() { return Number($('valor').value.replace(/\D/g, '')) || 0; }
function renderReparto() {
  const v = valorActual(), n = seleccion.size;
  if (n > 1 && v > 0) $('reparto').innerHTML = `Entre ${n}: <b>${dinero(v / n)}</b> cada uno`;
  else if (n === 1 && v > 0) $('reparto').innerHTML = `Todo para ${[...seleccion][0]}: <b>${dinero(v)}</b>`;
  else $('reparto').textContent = 'Si lo compartieron, elige a varios y se divide.';
}

$('personas').addEventListener('click', e => {
  const b = e.target.closest('.persona'); if (!b) return;
  const id = b.dataset.id;
  seleccion.has(id) ? seleccion.delete(id) : seleccion.add(id);
  renderPersonas();
});
$('btn-todos').addEventListener('click', () => {
  seleccion = seleccion.size === PERSONAS.length ? new Set() : new Set(PERSONAS.map(p => p.id));
  renderPersonas();
});
$('valor').addEventListener('input', e => {
  const digitos = e.target.value.replace(/\D/g, '').slice(0, 10);
  e.target.value = digitos ? Number(digitos).toLocaleString(CONFIG.LOCALE) : '';
  renderReparto();
});
$('menos').addEventListener('click', () => { cantidad = Math.max(1, cantidad - 1); $('cantidad').textContent = cantidad; });
$('mas').addEventListener('click', () => { cantidad = Math.min(99, cantidad + 1); $('cantidad').textContent = cantidad; });

/* ---------- Foto: se reduce en el celular antes de enviarla ---------- */
function comprimirImagen(archivo, maxLado = 1280, calidad = 0.72) {
  return new Promise((resolver, rechazar) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * escala), h = Math.round(img.naturalHeight * escala);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolver(canvas.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rechazar(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}
$('foto').addEventListener('change', async e => {
  const archivo = e.target.files[0]; if (!archivo) return;
  try {
    $('foto-btn').querySelector('span').textContent = 'Procesando…';
    fotoDataUrl = await comprimirImagen(archivo);
    $('foto-img').src = fotoDataUrl;
    $('foto-preview').style.display = 'block';
    $('foto-btn').style.display = 'none';
  } catch (err) { toast('No se pudo cargar la foto'); }
  finally { $('foto-btn').querySelector('span').textContent = 'Adjuntar foto'; e.target.value = ''; }
});
$('quitar-foto').addEventListener('click', quitarFoto);
function quitarFoto() {
  fotoDataUrl = null;
  $('foto-preview').style.display = 'none';
  $('foto-btn').style.display = 'flex';
}

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const producto = $('producto').value.trim();
  const valor = valorActual();
  if (!producto) { toast('Escribe el producto'); $('producto').focus(); return; }
  if (!valor) { toast('Escribe el valor'); $('valor').focus(); return; }
  if (!seleccion.size) { toast('Elige quién lo consumió'); return; }

  const reg = {
    id: nuevoId(), ...ahora(), producto, cantidad, valor,
    personas: [...seleccion], nota: $('nota').value.trim(), foto: fotoDataUrl
  };

  pendientes.push(reg);
  if (!lsGuardar('melo_pendientes', pendientes) && reg.foto) {
    // Si no cabe en memoria local (fotos pesadas), se guarda igual sin respaldo local.
    console.warn('No se pudo respaldar localmente');
  }

  // Limpiar formulario
  $('form').reset(); $('valor').value = ''; cantidad = 1; $('cantidad').textContent = '1';
  seleccion = new Set(); renderPersonas(); quitarFoto();
  document.activeElement?.blur();

  toast(navigator.onLine ? 'Guardando…' : 'Sin internet: se enviará luego');
  renderTodo();
  await sincronizar();
  if (!pendientes.find(p => p.id === reg.id)) toast('Guardado en la hoja');
});

/* ============================================================
   Historial
   ============================================================ */
function todosLosRegistros() {
  const pend = pendientes.map(p => ({ ...p, pendiente: true, valorPorPersona: p.valor / p.personas.length }));
  return [...pend, ...registros].sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));
}
function urlMiniatura(r, tam = 'w300') {
  if (r.pendiente) return r.foto || '';
  return r.fotoId ? `https://drive.google.com/thumbnail?id=${r.fotoId}&sz=${tam}` : '';
}

function renderFiltros() {
  const opciones = [{ id: 'Todos', emoji: '' }, ...PERSONAS];
  $('filtros').innerHTML = opciones.map(o =>
    `<button class="chip ${filtro === o.id ? 'sel' : ''}" data-f="${o.id}">${o.emoji ? o.emoji + ' ' : ''}${o.id}</button>`).join('');
}
$('filtros').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filtro = b.dataset.f; renderHistorial();
});

function renderHistorial() {
  renderFiltros();
  const lista = todosLosRegistros().filter(r => filtro === 'Todos' || r.personas.includes(filtro));

  if (!lista.length) {
    $('resumen-filtro').innerHTML = '';
    $('lista').innerHTML = `<div class="vacio"><div class="cond">Sin consumos</div>${filtro !== 'Todos' ? esc(filtro) + ' no ha registrado nada todavía.' : 'Lo que registren aparecerá aquí.'}</div>`;
    return;
  }

  const total = lista.reduce((s, r) => s + (filtro === 'Todos' ? r.valor : r.valorPorPersona), 0);
  $('resumen-filtro').innerHTML = `<span>${lista.length} consumo${lista.length > 1 ? 's' : ''}${filtro === 'Todos' ? '' : ' · le corresponde'}</span><b>${dinero(total)}</b>`;

  let html = '', diaActual = '';
  for (const r of lista) {
    if (r.fecha !== diaActual) { diaActual = r.fecha; html += `<div class="grupo-dia">${esc(nombreDia(r.fecha))}</div>`; }
    const mini = urlMiniatura(r);
    const foto = mini
      ? `<button class="thumb-btn" data-ver="${esc(r.id)}" aria-label="Ver foto"><img class="thumb" src="${esc(mini)}" loading="lazy" alt="" onerror="this.parentNode.remove()"></button>`
      : '';
    const reparto = r.personas.length > 1 ? `<span>${dinero(r.valorPorPersona)} c/u</span>` : '';
    html += `
      <div class="item">
        <div class="hora">${esc(String(r.hora).slice(0, 5))}</div>
        <div class="item-cuerpo">
          <div class="item-top"><span class="prod">${esc(r.producto)}${r.cantidad > 1 ? ` <small>×${r.cantidad}</small>` : ''}</span><span class="item-valor">${dinero(r.valor)}</span></div>
          <div class="item-meta"><span class="quien" title="${esc(r.personas.join(', '))}">${r.personas.map(p => EMOJI[p] || '👤').join('')}</span>${reparto}${r.pendiente ? '<span class="pend-tag">Sin enviar</span>' : ''}</div>
          ${r.nota ? `<div class="item-nota">${esc(r.nota)}</div>` : ''}
          <div class="item-pie">${foto}<button class="borrar" data-borrar="${esc(r.id)}">Eliminar</button></div>
        </div>
      </div>`;
  }
  $('lista').innerHTML = html;
}

$('lista').addEventListener('click', async e => {
  const ver = e.target.closest('[data-ver]');
  if (ver) {
    const r = todosLosRegistros().find(x => x.id === ver.dataset.ver);
    if (r) abrirVisor(r);
    return;
  }
  const btn = e.target.closest('[data-borrar]'); if (!btn) return;
  const r = todosLosRegistros().find(x => x.id === btn.dataset.borrar); if (!r) return;
  const ok = await confirmar('¿Eliminar consumo?', `${r.producto} — ${dinero(r.valor)}. También se borrará de Google Sheets.`);
  if (!ok) return;

  if (r.pendiente) {
    pendientes = pendientes.filter(p => p.id !== r.id); lsGuardar('melo_pendientes', pendientes);
    renderTodo(); actualizarEstado(); toast('Eliminado'); return;
  }
  try {
    btn.textContent = 'Eliminando…';
    const j = await apiPost({ accion: 'eliminar', id: r.id });
    if (!j.ok) throw new Error(j.error);
    registros = registros.filter(x => x.id !== r.id); lsGuardar('melo_cache', registros);
    renderTodo(); toast('Eliminado');
  } catch (err) { btn.textContent = 'Eliminar'; toast('No se pudo eliminar: ' + (err.message || 'sin conexión')); }
});

function abrirVisor(r) {
  $('visor-img').src = r.pendiente ? r.foto : urlMiniatura(r, 'w1600');
  const link = $('visor-link');
  if (r.fotoUrl) { link.href = r.fotoUrl; link.style.display = ''; } else link.style.display = 'none';
  $('visor').classList.add('ver');
}
$('visor').addEventListener('click', e => { if (e.target.id !== 'visor-link') $('visor').classList.remove('ver'); });

/* ============================================================
   Ranking 🏆
   ============================================================ */
function calcularTotales() {
  const t = Object.fromEntries(PERSONAS.map(p => [p.id, { ...p, total: 0, consumos: 0 }]));
  for (const r of todosLosRegistros()) {
    const parte = r.valor / r.personas.length;
    for (const p of r.personas) if (t[p]) { t[p].total += parte; t[p].consumos++; }
  }
  return Object.values(t).sort((a, b) => b.total - a.total);
}

function renderRanking() {
  const todos = todosLosRegistros();
  const totales = calcularTotales();
  const totalViaje = todos.reduce((s, r) => s + r.valor, 0);
  const maximo = Math.max(1, ...totales.map(t => t.total));
  const masCaro = todos.reduce((m, r) => (!m || r.valor > m.valor ? r : m), null);

  $('total-viaje').textContent = dinero(totalViaje);
  const dias = new Set(todos.map(r => r.fecha)).size;
  $('stats').innerHTML = `<div class="stat"><b>${todos.length}</b>consumos</div><div class="stat"><b>${dias}</b>día${dias === 1 ? '' : 's'}</div>`
    + (masCaro ? `<div class="stat"><b>${dinero(masCaro.valor)}</b>el más caro: ${esc(masCaro.producto)}</div>` : '');

  $('ranking').innerHTML = totales.map((t, i) => `
    <div class="rank ${i === 0 && t.total > 0 ? 'lider' : ''}">
      <div class="placa">${t.total > 0 ? String(i + 1).padStart(2, '0') : '—'}</div>
      <div class="rank-cuerpo">
        <div class="rank-nombre"><span class="n">${t.emoji} ${esc(t.id)}${i === 0 && t.total > 0 ? ' 🏆' : ''}</span><span class="v">${dinero(t.total)}</span></div>
        <div class="barra"><i style="width:${(t.total / maximo) * 100}%"></i></div>
        <div class="rank-meta">${t.consumos} consumo${t.consumos === 1 ? '' : 's'} · ${totalViaje ? Math.round((t.total / totalViaje) * 100) : 0}% del total</div>
      </div>
    </div>`).join('');
}

$('btn-copiar').addEventListener('click', async () => {
  const totales = calcularTotales();
  const total = todosLosRegistros().reduce((s, r) => s + r.valor, 0);
  const { fecha, hora } = ahora();
  const texto = [`🏍️ Consumos viaje a Melo (corte ${fecha} ${hora.slice(0, 5)})`, '',
    ...totales.map((t, i) => `${['🥇', '🥈', '🥉', '4️⃣'][i]} ${t.emoji} ${t.id}: ${dinero(t.total)} (${t.consumos})`),
    '', `💰 Total: ${dinero(total)}`].join('\n');
  try { await navigator.clipboard.writeText(texto); toast('Resumen copiado'); }
  catch { toast('No se pudo copiar'); }
});

/* ============================================================
   Navegación, modales y arranque
   ============================================================ */
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('activa', t === tab));
  document.querySelectorAll('.vista').forEach(v => v.classList.toggle('activa', v.id === 'vista-' + tab.dataset.vista));
  window.scrollTo({ top: 0 });
  if (tab.dataset.vista !== 'registrar') cargarRegistros(true);
}));

function renderSugerencias() {
  const unicos = [...new Set(registros.map(r => r.producto))].slice(0, 40);
  $('sugerencias').innerHTML = unicos.map(p => `<option value="${esc(p)}">`).join('');
}
function renderTodo() { renderHistorial(); renderRanking(); renderSugerencias(); actualizarEstado(); }

$('estado-sync').addEventListener('click', async () => { await sincronizar(); await cargarRegistros(); toast('Datos actualizados'); });

function confirmar(titulo, texto) {
  return new Promise(resolver => {
    $('conf-titulo').textContent = titulo; $('conf-texto').textContent = texto;
    const m = $('modal-confirmar'); m.classList.add('ver');
    const cerrar = v => { m.classList.remove('ver'); $('conf-si').onclick = $('conf-no').onclick = null; resolver(v); };
    $('conf-si').onclick = () => cerrar(true);
    $('conf-no').onclick = () => cerrar(false);
  });
}

window.addEventListener('online', sincronizar);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sincronizar(); cargarRegistros(true); } });

// Arranque
$('aviso-config').hidden = apiConfigurada();
renderPersonas();
renderTodo();
if (apiConfigurada()) { cargarRegistros(true); sincronizar(); }
</script>
